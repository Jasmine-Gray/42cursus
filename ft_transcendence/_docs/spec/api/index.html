<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
<script>
Scalar.createApiReference('#app', { content: {"openapi": "3.1.1", "info": {"title": "ワードウルフ REST API", "version": "0.1.0", "summary": "探偵テーマのワードウルフのHTTP API契約（_docs/mock/ の画面モック準拠）", "description": "探偵テーマのワードウルフ（`_docs/mock/` の画面モック準拠）のHTTP API契約。Draft 0.1。\n\nリアルタイム性が必要な通信（チャット送受信、フェーズ遷移の配信、準備状態、ゲーム開始の配信、\n投票進捗、切断・再接続、フレンドのオンライン状態）はPhoenix Channelsで行い、本書の対象外とする。\nイベント契約は [asyncapi.yaml](asyncapi.yaml)（HTML版: realtime.html）を参照する。\n\n## 共通規約\n\n- キー名はJSONの `camelCase` とする。\n- IDは推測不能な文字列として扱う（例: `user_...`, `room_...`, `game_...`）。\n- 日時はUTCのISO 8601文字列、時間の長さはミリ秒単位の整数とする。\n- クライアントは `userId`、役職、現在フェーズ、締切を送信しない。操作者は認証セッションから特定する。\n- 成功は `{\"status\": \"ok\", \"data\": ...}`、失敗は `{\"status\": \"error\", \"error\": {\"code\", \"message\"}}` の封筒形式とする。\n- 認証は `POST /auth/register` / `POST /auth/login` が発行するBearerトークン（sessionsテーブルのtoken）とする。\n- 役職・他人のお題などの秘密情報は、本人向けエンドポイント（`/games/{gameId}/assignment`）と\n  結果確定後（`/games/{gameId}/result`）以外で返さない。\n\n## 画面とAPIの対応\n\n| 画面 | HTTP | リアルタイム（Channel） |\n|---|---|---|\n| 01 ログイン | `POST /auth/login` | - |\n| 02 新規登録 | `POST /auth/register` | - |\n| 03 アバター設定 | `PUT /users/me/avatar` | - |\n| 04 ホーム | `GET /users/me` | - |\n| 05 招待URL検索 / 06 招待確認 | `GET /invites/{inviteCode}` → `POST /rooms/{roomId}/join` | - |\n| 07 部屋を作る | `POST /rooms` | - |\n| 08-10 ロビー | `GET /rooms/{roomId}`, `PUT /rooms/{roomId}/settings`, `POST /rooms/{roomId}/leave` | `room.ready`, `room.state` |\n| 08 ゲーム開始（ホストのみ） | `POST /rooms/{roomId}/start` | `phase.changed` を全員へ配信 |\n| 11 カウントダウン / 12-13 お題確認 | `GET /games/{gameId}/assignment` | `phase.changed` |\n| 14-15 捜査会議（議論） | `GET /games/{gameId}`, `GET /games/{gameId}/messages` | `chat.send` / `chat.published` |\n| 16 観戦 | 同上（秘密情報なし） | 同上（閲覧のみ） |\n| 17 投票観戦 | `GET /games/{gameId}`（`voteProgress`） | 投票進捗の配信 |\n| 18 一時停止・再接続 | 復帰時 `GET /games/{gameId}` | `game.paused` / `game.resumed` / `game.aborted` |\n| 19 投票 | `POST /games/{gameId}/votes` | 投票進捗の配信 |\n| 20 結果発表 | `GET /games/{gameId}/result` | `result.published`（30秒後に `phase.changed` で全員LOBBYへ） |\n| 21 フレンド | `GET /friends`, `GET/POST /friends/requests`, accept/decline, `GET /users` | オンライン状態の配信 |\n| 22 プロフィール | `GET/PUT /users/me`, `PUT /users/me/avatar`, `DELETE /users/me`, `GET /users/me/games` | - |\n| 23 プライバシー / 24 利用規約 | 静的ページ（API不要） | - |\n"}, "servers": [{"url": "http://localhost:4000/api/v1", "description": "開発環境（Phoenix）"}], "security": [{"bearerAuth": []}], "tags": [{"name": "auth", "description": "認証（画面01, 02）"}, {"name": "users", "description": "自分のプロフィール・戦績（画面03, 04, 22）"}, {"name": "rooms", "description": "部屋の作成・招待・参加・ロビー（画面05-10）"}, {"name": "games", "description": "ゲーム進行のHTTP面（画面11-20）。進行の配信はChannelが担当"}, {"name": "friends", "description": "フレンド（画面21）"}, {"name": "system", "description": "死活監視・運用（対応画面なし）"}], "paths": {"/health": {"get": {"tags": ["system"], "operationId": "getHealth", "security": [], "summary": "死活監視", "description": "認証不要。監視・疎通確認用。依存先（DB等）の内部状態は返さない。契約→型生成→実装フローのリファレンス実装を兼ねる（_docs/dev/index.html §11）", "responses": {"200": {"description": "サーバー稼働中", "content": {"application/json": {"schema": {"allOf": [{"$ref": "#/components/schemas/OkEnvelope"}, {"type": "object", "required": ["data"], "properties": {"data": {"$ref": "#/components/schemas/Health"}}}]}}}}}}}, "/auth/register": {"post": {"tags": ["auth"], "operationId": "register", "security": [], "summary": "新規登録", "description": "成功時はセッションを発行し、そのままアバター設定（画面03）へ進める。エラー: INVALID_PAYLOAD, EMAIL_TAKEN", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RegisterRequest"}}}}, "responses": {"201": {"description": "作成したユーザーとセッション", "content": {"application/json": {"schema": {"allOf": [{"$ref": "#/components/schemas/OkEnvelope"}, {"type": "object", "required": ["data"], "properties": {"data": {"$ref": "#/components/schemas/AuthSession"}}}]}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "409": {"$ref": "#/components/responses/Conflict"}}}}, "/auth/login": {"post": {"tags": ["auth"], "operationId": "login", "security": [], "summary": "ログイン", "description": "エラー: INVALID_PAYLOAD, INVALID_CREDENTIALS（メール・パスワードのどちらが誤りかは区別しない）", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LoginRequest"}}}}, "responses": {"200": {"description": "ユーザーとセッション", "content": {"application/json": {"schema": {"allOf": [{"$ref": "#/components/schemas/OkEnvelope"}, {"type": "object", "required": ["data"], "properties": {"data": {"$ref": "#/components/schemas/AuthSession"}}}]}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}}}}, "/auth/logout": {"post": {"tags": ["auth"], "operationId": "logout", "summary": "ログアウト（現在セッションの失効）", "responses": {"200": {"$ref": "#/components/responses/OkOnly"}, "401": {"$ref": "#/components/responses/Unauthorized"}}}}, "/users/me": {"get": {"tags": ["users"], "operationId": "getMe", "summary": "自分の情報（ホーム・プロフィール表示用）", "description": "パスワード関連の値は含めない。`activeRoom` は参加中の部屋がない場合 `null`。", "responses": {"200": {"description": "プロフィール、戦績、フレンド数、参加中の部屋", "content": {"application/json": {"schema": {"allOf": [{"$ref": "#/components/schemas/OkEnvelope"}, {"type": "object", "required": ["data"], "properties": {"data": {"$ref": "#/components/schemas/MeData"}}}]}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}}}, "put": {"tags": ["users"], "operationId": "updateProfile", "summary": "プロフィール編集（表示名・ひとこと）", "description": "エラー: INVALID_PAYLOAD", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/UpdateProfileRequest"}}}}, "responses": {"200": {"description": "更新後のユーザー", "content": {"application/json": {"schema": {"allOf": [{"$ref": "#/components/schemas/OkEnvelope"}, {"type": "object", "required": ["data"], "properties": {"data": {"$ref": "#/components/schemas/UserPrivate"}}}]}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}}}, "delete": {"tags": ["users"], "operationId": "deleteAccount", "summary": "アカウント削除", "description": "プロフィール、フレンド、ゲーム履歴を削除する。取り消しできない。", "responses": {"200": {"$ref": "#/components/responses/OkOnly"}, "401": {"$ref": "#/components/responses/Unauthorized"}}}}, "/users/me/avatar": {"put": {"tags": ["users"], "operationId": "updateAvatar", "summary": "アバター変更（プリセット選択またはアップロード）", "description": "画面03と画面22で共用する。PNG・JPEG・WebP、5MiB（5242880 bytes）以下、 幅・高さそれぞれ1〜4096px。縦長・横長など任意の縦横比に対応する。 PNG・WebPの透過と元の縦横比を保持し、正方形への切り抜き・背景の合成は行わない。 ファイルの画像形式と寸法をサーバーで確認する。エラー: INVALID_PAYLOAD", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AvatarPresetRequest"}}, "multipart/form-data": {"schema": {"type": "object", "required": ["file"], "properties": {"file": {"type": "string", "contentMediaType": "image/*", "contentEncoding": "binary", "description": "PNG・JPEG・WebP、5MiB以下、各辺1〜4096px。縦横比・透過を保持する"}}}}}}, "responses": {"200": {"description": "更新後のユーザー", "content": {"application/json": {"schema": {"allOf": [{"$ref": "#/components/schemas/OkEnvelope"}, {"type": "object", "required": ["data"], "properties": {"data": {"$ref": "#/components/schemas/UserPrivate"}}}]}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}}}}, "/users/me/games": {"get": {"tags": ["users"], "operationId": "listMyGames", "summary": "自分の対戦履歴（プロフィールの「最近の対戦」）", "parameters": [{"name": "page", "in": "query", "schema": {"type": "integer", "minimum": 1, "default": 1}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 50, "default": 20}}], "responses": {"200": {"description": "新しい順の対戦履歴。中止されたゲームは含めない。", "content": {"application/json": {"schema": {"allOf": [{"$ref": "#/components/schemas/OkEnvelope"}, {"type": "object", "required": ["data"], "properties": {"data": {"type": "object", "required": ["items", "meta"], "properties": {"items": {"type": "array", "items": {"$ref": "#/components/schemas/MatchHistoryItem"}}, "meta": {"$ref": "#/components/schemas/PaginationMeta"}}}}}]}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}}}}, "/users/{userId}": {"get": {"tags": ["users"], "operationId": "getUserProfile", "summary": "参加者の公開プロフィールとひとことを取得", "description": "認証済みユーザーが閲覧できる。メールアドレスなどの非公開情報は返さない。", "parameters": [{"name": "userId", "in": "path", "required": true, "schema": {"type": "string"}}], "responses": {"200": {"description": "公開プロフィール", "content": {"application/json": {"schema": {"allOf": [{"$ref": "#/components/schemas/OkEnvelope"}, {"type": "object", "required": ["data"], "properties": {"data": {"$ref": "#/components/schemas/UserProfile"}}}]}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/users": {"get": {"tags": ["friends"], "operationId": "searchUsers", "summary": "表示名でユーザーを検索（フレンド申請用）", "parameters": [{"name": "q", "in": "query", "required": true, "schema": {"type": "string", "minLength": 2}, "description": "表示名の部分一致"}], "responses": {"200": {"description": "一致したユーザーの公開プロフィール（自分自身は含めない）", "content": {"application/json": {"schema": {"allOf": [{"$ref": "#/components/schemas/OkEnvelope"}, {"type": "object", "required": ["data"], "properties": {"data": {"type": "object", "required": ["items"], "properties": {"items": {"type": "array", "items": {"$ref": "#/components/schemas/UserPublic"}}}}}}]}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}}}}, "/invites": {"get": {"tags": ["rooms"], "operationId": "listMyInvites", "summary": "受信した部屋招待一覧", "description": "自分宛ての有効な部屋招待（部屋がCLOSEDでないもの）の一覧を取得する。Discord風未読バッジや招待一覧に使う。", "responses": {"200": {"description": "受信した部屋招待一覧", "content": {"application/json": {"schema": {"allOf": [{"$ref": "#/components/schemas/OkEnvelope"}, {"type": "object", "required": ["data"], "properties": {"data": {"type": "object", "required": ["items"], "properties": {"items": {"type": "array", "items": {"$ref": "#/components/schemas/RoomInvite"}}}}}}]}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}}}}, "/invites/{inviteId}/accept": {"post": {"tags": ["rooms"], "operationId": "acceptRoomInvite", "summary": "部屋招待を承認して参加", "description": "招待を承認して部屋に参加する。", "parameters": [{"$ref": "#/components/parameters/InviteId"}], "requestBody": {"required": false, "content": {"application/json": {"schema": {"type": "object", "properties": {"participantType": {"$ref": "#/components/schemas/ParticipantType"}}}}}}, "responses": {"200": {"description": "参加後の部屋と接続先Topic", "content": {"application/json": {"schema": {"allOf": [{"$ref": "#/components/schemas/OkEnvelope"}, {"type": "object", "required": ["data"], "properties": {"data": {"type": "object", "required": ["room", "realtime"], "properties": {"room": {"$ref": "#/components/schemas/RoomState"}, "realtime": {"$ref": "#/components/schemas/RealtimeTopics"}}}}}]}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}}}}, "/invites/{inviteId}/decline": {"post": {"tags": ["rooms"], "operationId": "declineRoomInvite", "summary": "部屋招待を辞退", "parameters": [{"$ref": "#/components/parameters/InviteId"}], "responses": {"200": {"$ref": "#/components/responses/OkOnly"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/invites/{inviteCode}": {"get": {"tags": ["rooms"], "operationId": "getInvite", "summary": "招待コードから部屋情報を取得（招待URLの有無確認）", "description": "招待URL `https://<host>/join/{inviteCode}` のコード部分で照会する。存在しない・終了済みの場合は404。", "parameters": [{"name": "inviteCode", "in": "path", "required": true, "schema": {"type": "string", "pattern": "^[A-Za-z0-9-]+$"}, "example": "CASE-042"}], "responses": {"200": {"description": "参加確認画面（画面06）に必要な部屋の概要", "content": {"application/json": {"schema": {"allOf": [{"$ref": "#/components/schemas/OkEnvelope"}, {"type": "object", "required": ["data"], "properties": {"data": {"$ref": "#/components/schemas/RoomPreview"}}}]}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/rooms": {"post": {"tags": ["rooms"], "operationId": "createRoom", "summary": "部屋を作成（作成者が最初のホスト）", "description": "お題ジャンルは1つ以上。作成時に招待コードとURLを発行する。エラー: INVALID_PAYLOAD", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RoomSettingsInput"}}}}, "responses": {"201": {"description": "作成した部屋（作成者はプレイヤーとして参加済み）", "content": {"application/json": {"schema": {"allOf": [{"$ref": "#/components/schemas/OkEnvelope"}, {"type": "object", "required": ["data"], "properties": {"data": {"$ref": "#/components/schemas/RoomState"}}}]}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}}}}, "/rooms/{roomId}": {"get": {"tags": ["rooms"], "operationId": "getRoom", "summary": "部屋の状態を取得（ロビー表示用）", "description": "参加者（プレイヤー・観戦者）だけが取得できる。プレイヤーの名前・アバター・準備状態・接続状態を含む。", "parameters": [{"$ref": "#/components/parameters/RoomId"}], "responses": {"200": {"description": "部屋の公開状態", "content": {"application/json": {"schema": {"allOf": [{"$ref": "#/components/schemas/OkEnvelope"}, {"type": "object", "required": ["data"], "properties": {"data": {"$ref": "#/components/schemas/RoomState"}}}]}}}}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}}}}, "/rooms/{roomId}/settings": {"put": {"tags": ["rooms"], "operationId": "updateRoomSettings", "summary": "部屋設定の変更（ホストのみ、LOBBY中のみ）", "description": "エラー: INVALID_PAYLOAD, NOT_HOST, INVALID_PHASE（進行中は変更不可）", "parameters": [{"$ref": "#/components/parameters/RoomId"}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RoomSettingsInput"}}}}, "responses": {"200": {"description": "更新後の部屋。`room.state` で全員へ配信される。", "content": {"application/json": {"schema": {"allOf": [{"$ref": "#/components/schemas/OkEnvelope"}, {"type": "object", "required": ["data"], "properties": {"data": {"$ref": "#/components/schemas/RoomState"}}}]}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}}}}, "/rooms/{roomId}/members/{userId}": {"delete": {"tags": ["rooms"], "operationId": "removeRoomMember", "summary": "参加者を退出させる（ホストのみ、LOBBY中のみ）", "description": "指定したプレイヤーまたは観戦者を部屋から退出させる。自分自身は対象にできない。 対象の部屋チャンネルと本人用チャンネルへ room.removed を通知する。部屋チャンネルを閉じ、残りの参加者へ room.state を配信する。 永続的な参加禁止ではなく、招待からの再参加は可能。 エラー: NOT_HOST, INVALID_PHASE, INVALID_PAYLOAD（自分自身）, NOT_FOUND（部屋・参加者なし）", "parameters": [{"$ref": "#/components/parameters/RoomId"}, {"name": "userId", "in": "path", "required": true, "schema": {"type": "string"}}], "responses": {"200": {"description": "退出処理後の部屋", "content": {"application/json": {"schema": {"allOf": [{"$ref": "#/components/schemas/OkEnvelope"}, {"type": "object", "required": ["data"], "properties": {"data": {"$ref": "#/components/schemas/RoomState"}}}]}}}}, "400": {"$ref": "#/components/responses/BadRequest"}, "401": {"$ref": "#/components/responses/Unauthorized"}, "403": {"$ref": "#/components/responses/Forbidden"}, "404": {"$ref": "#/components/responses/NotFound"}, "409": {"$ref": "#/components/responses/Conflict"}}}}, "/rooms/{roomId}/join": {"post": {"tags": ["rooms"], "operationId": "joinRoom", "summary": "部屋へ参加（プレイヤー参加または観戦）", "description": "画面06の「プレイヤー参加」「観戦する」に対応する。ゲーム進行中の部屋へのプレイヤー参加は拒否し、 観戦参加は許可する。成功後、クライアントは `realtime` のTopicへJoinする。 待機中の既存参加者は同じAPIでプレイヤーと観戦者を切り替えられる。 ホストが観戦へ切り替える場合は最古参の別プレイヤーへホストを委譲する。 別プレイヤーがいない場合はINVALID_PHASE。進行中の参加方法変更はGAME_IN_PROGRESS。 エラー: INVALID_PAYLOAD, ROOM_FULL, ALRE
