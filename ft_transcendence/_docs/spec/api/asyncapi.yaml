asyncapi: 3.1.0
info:
  title: ワードウルフ Realtime API（Phoenix Channels）
  version: 0.1.0
  description: |
    探偵テーマのワードウルフのリアルタイム通信契約。Draft 0.1。

    本書はPhoenixサーバー視点で記述する。`receive` はクライアント→サーバーの要求、
    `send` はサーバー→クライアントの配信を表す。
    HTTP APIは [openapi.yaml](openapi.yaml) を参照する。
    部屋の作成・参加・退出・ゲーム開始・投票・結果取得はHTTP側で行う。

    ## 共通規約

    - キー名はJSONの `camelCase` とする。
    - 日時はUTCのISO 8601文字列、時間の長さはミリ秒単位の整数とする。
    - IDは推測不能な文字列として扱う。
    - クライアントは `userId`、役職、現在フェーズ、締切を送信しない。
    - 要求へのReplyは成功時 `{"status": "ok", ...}`、失敗時
      `{"status": "error", "error": {"code", "message"}}` とする。
      エラーコードはOpenAPI側の `ErrorCode` と同じ語彙に加え、Channel固有の
      `STALE_CONNECTION`（新しいタブに置換された古い接続）と `GAME_PAUSED`（切断待機中）を使う。
    - Channel Joinごとに推測不能な `connectionId` を発行し、同一ユーザーの新しい接続が古い接続を無効化する。
    - 観戦者専用のお題一覧はHTTPの getSpectatorAssignments で取得する。部屋の公開配信には含めない。
    - 秘密情報（自分のお題）は `user:{userId}` チャンネルだけで配信し、公開Payloadに含めない。

    ## 受理フェーズ一覧（クライアント→サーバー）

    | イベント | LOBBY | DEALING | DISCUSSION | VOTING | COMEBACK | RESULT |
    |---|:---:|:---:|:---:|:---:|:---:|:---:|
    | `room.ready` | Yes | No | No | No | No | No |
    | `chat.send` | No | No | Yes | No | No | No |
    | `discussion.skip` | No | No | Yes | No | No | No |
    | `state.request` | Yes | Yes | Yes | Yes | Yes | Yes |

    | `comeback.draft` / `comeback.submit` | No | No | No | No | Yes | No |

    `RESULT` は30秒表示した後、全員が `LOBBY` へ戻る。`RESULT` から次のゲームを直接開始する
    再戦イベントは存在しない。次のゲームはロビーの開始フローを経由する。

    一時停止中は `state.request` 以外を `GAME_PAUSED` で拒否する。
    投票の送信はHTTPの `POST /games/{gameId}/votes` で行い、進捗は `vote.progress` で配信する。

    ## 議論のスキップ

    DISCUSSION中は `discussion.skip` で締切前に投票へ進める。プレイヤー**全員**が賛成した
    時点で `VOTING` へ遷移する。`room.ready` と同じくトグルで、賛成の取り消しもできる。
    最低議論時間は設けない（開始直後に全員が賛成すれば即座に投票へ移れる）。
    観戦者は賛成できない（`NOT_A_PLAYER`）。賛成人数は `skip.progress` で全員へ配信する。
    切断者が出て一時停止した場合は他のイベントと同様に `GAME_PAUSED` で拒否し、
    再開後も賛成状態は保持する。`VOTING` へ移った時点で賛成状態は破棄する。

    ## お題の抽選と逆転モード

    お題は部屋のジャンルに合う有効な関連グループから一様に抽選する。
    候補が2グループ以上あれば同じ部屋の直前のゲームのグループを除外する。
    グループには重複のない2語以上を保存し、そこから異なる2語を無作為に選ぶ。
    先の語を多数派、後の語を少数派へ配り、保存順によって陣営を固定しない。
    `comebackEnabled` は部屋ごとの設定で既定false。trueかつウルフが単独最多票なら
    RESULTを公開せずCOMEBACKへ移り、回答者のwolfUserIdと空のcontentだけを公開する。
    回答は30秒以内に1回。正解は市民側のお題とNFKC正規化・空白除去・小文字化・
    カタカナをひらがなへ変換した上で一致する場合。漢字の読み替えや類義語判定はしない。
    正解ならWOLF_SIDE / WOLF_GUESSED、不正解または時間切れならCITIZEN_SIDE / WOLF_IDENTIFIED。
    プレイヤーへの正解のお題・全役職・結果の公開は回答確定後のRESULTまで行わない。観戦者は専用HTTP APIでお題・役職を取得できる。
    回答者の最新接続のみcomeback.draft/submitを受理する。他プレイヤー・観戦者はFORBIDDEN。
    draftは空を含む80文字以内、同じ回答者から100ms未満の更新はRATE_LIMITED。
    submitはtrim後1〜80文字の最終回答を必ず含み、直前のdraftの到着を待つ必要はない。
    タイムアウト時は途中入力を回答扱いにせず、不正解として確定する。
    入力はcomeback.updatedとroom.state.comebackで全員に復元可能。プレーンテキストで表示する。
    COMEBACK中も切断で一時停止し、再接続時は残り時間と入力内容を保持する。

defaultContentType: application/json
servers:
  development:
    host: localhost:4000
    protocol: ws
    pathname: /socket/websocket
    description: |
      開発環境のPhoenix Socket。接続時にconnectパラメータ `token` でセッショントークンを渡す。
      `user:{userId}` へのJoinは、Socketの認証済みユーザーとTopicのIDが一致し、
      かつその部屋の有効な最新接続である場合だけ許可する。
channels:
  room:
    address: 'room:{roomId}'
    title: 部屋チャンネル
    summary: 許可されたプレイヤー・観戦者が参加する公開チャンネル
    description: |
      公開状態、チャット、フェーズ遷移、接続状態、投票進捗、結果を扱う。
      Join成功時のReplyは `{"status": "ok", "connectionId": "conn_...", "publicState": {...}}` とし、
      `publicState` の形は `room.state` のPayloadと同じ。秘密情報は含めない。
    parameters:
      roomId:
        description: 部屋ID（推測不能な文字列）
    messages:
      roomReady: {$ref: '#/components/messages/roomReady'}
      chatSend: {$ref: '#/components/messages/chatSend'}
      discussionSkip: {$ref: '#/components/messages/discussionSkip'}
      comebackDraft: {$ref: '#/components/messages/comebackDraft'}
      comebackSubmit: {$ref: '#/components/messages/comebackSubmit'}
      comebackUpdated: {$ref: '#/components/messages/comebackUpdated'}
      stateRequest: {$ref: '#/components/messages/stateRequest'}
      roomState: {$ref: '#/components/messages/roomState'}
      roomRemoved: {$ref: '#/components/messages/roomRemoved'}
      phaseChanged: {$ref: '#/components/messages/phaseChanged'}
      chatPublished: {$ref: '#/components/messages/chatPublished'}
      playerConnectionChanged: {$ref: '#/components/messages/playerConnectionChanged'}
      gamePaused: {$ref: '#/components/messages/gamePaused'}
      gameResumed: {$ref: '#/components/messages/gameResumed'}
      skipProgress: {$ref: '#/components/messages/skipProgress'}
      voteProgress: {$ref: '#/components/messages/voteProgress'}
      resultPublished: {$ref: '#/components/messages/resultPublished'}
      gameAborted: {$ref: '#/components/messages/gameAborted'}
  user:
    address: 'user:{userId}'
    title: 本人チャンネル
    summary: 認証済み本人だけがJoinできる秘密チャンネル
    description: |
      自分のお題、接続置換通知、フレンドのオンライン状態変化、部屋への招待、ホストによる退出通知を配信する。
      Joinできるのは認証済み本人だけで、`userId` が接続の本人と一致しない場合は `FORBIDDEN` で拒否する。
      Joinパラメータ `roomId` と `connectionId` は任意。両方を伴うJoinはゲーム中の接続とみなし、
      その部屋の有効な最新接続だけがJoinを維持できる（古い接続は `STALE_CONNECTION` として拒否する）。
      省略したJoinは部屋の文脈を持たず、招待、ホストによる退出通知、フレンドのオンライン状態を受け取る。
      ロビーやホーム画面のように部屋に入っていない状態でも招待を受け取れるようにするための区別。
    parameters:
      userId:
        description: 認証済みユーザー自身のID
    messages:
      privateState: {$ref: '#/components/messages/privateState'}
      connectionReplaced: {$ref: '#/components/messages/connectionReplaced'}
      friendPresenceChanged: {$ref: '#/components/messages/friendPresenceChanged'}
      roomInvited: {$ref: '#/components/messages/roomInvited'}
      roomRemoved: {$ref: '#/components/messages/roomRemoved'}
operations:
  publishUserRoomRemoved:
    action: send
    channel: {$ref: '#/channels/user'}
    title: ホストによる退出通知を本人へ配信
    summary: ロビー以外の画面でも本人が退出を知れるよう、部屋名を含めて通知する。本人用チャンネルは閉じない
    messages: [{$ref: '#/channels/user/messages/roomRemoved'}]
  publishRoomRemoved:
    action: send
    channel: {$ref: '#/channels/room'}
    title: ホストによる退出を対象者へ通知
    summary: 対象者の接続だけに配信してチャンネルを閉じる。クライアントは退出理由とホームへの導線を表示する
    messages: [{$ref: '#/channels/room/messages/roomRemoved'}]
  onComebackDraft:
    action: receive
    channel: {$ref: '#/channels/room'}
    messages: [{$ref: '#/channels/room/messages/comebackDraft'}]
  onComebackSubmit:
    action: receive
    channel: {$ref: '#/channels/room'}
    messages: [{$ref: '#/channels/room/messages/comebackSubmit'}]
  publishComebackUpdated:
    action: send
    channel: {$ref: '#/channels/room'}
    messages: [{$ref: '#/channels/room/messages/comebackUpdated'}]
  onRoomReady:
    action: receive
    channel: {$ref: '#/channels/room'}
    title: 準備状態の変更
    summary: LOBBY中のプレイヤーが自分の準備状態を切り替える
    description: |
      ホストは常に準備完了として扱う。ホストの `ready: false` は無視し、成功Replyは `{"status": "ok", "ready": true}`。
      部屋の作成時・結果の後に LOBBY へ戻ったとき・ホスト移譲で新しいホストになったときも、ホストは準備完了になる
      （ホスト以外のプレイヤーは結果の後に準備中へ戻る）。
    messages: [{$ref: '#/channels/room/messages/roomReady'}]
  onChatSend:
    action: receive
    channel: {$ref: '#/channels/room'}
    title: チャット送信
    summary: DISCUSSION中のプレイヤーだけが送信できる
    description: |
      成功Replyは `{"status": "ok", "messageId": "msg_..."}`。
      サーバーでtrim後1〜300文字、1秒1件かつ10秒5件のレート制限を検証する。
      制限違反は接続を切らず、対象メッセージだけ `RATE_LIMITED` で拒否する。
    messages: [{$ref: '#/channels/room/messages/chatSend'}]
  onDiscussionSkip:
    action: receive
    channel: {$ref: '#/channels/room'}
    title: 議論スキップの賛成切り替え
    summary: DISCUSSION中のプレイヤーが、締切を待たず投票へ進むことに賛成する
    description: |
      成功Replyは `{"status": "ok", "skip": true|false}`。`room.ready` と同じトグルで、
      同じ値を送り直しても冪等に扱う。プレイヤー全員が賛成した時点で `VOTING` へ遷移し、
      `phase.changed` を配信する。観戦者は `NOT_A_PLAYER` で拒否する。
    messages: [{$ref: '#/channels/room/messages/discussionSkip'}]
  onStateRequest:
    action: receive
    channel: {$ref: '#/channels/room'}
    title: 現在状態の再送要求
    summary: 初回Joinおよび再接続時に使用する。全フェーズで受理する
    description: Replyに閲覧者向けにフィルタした公開状態を返す。本人用秘密情報は `user:{userId}` の `private.state` で再送する。
    messages: [{$ref: '#/channels/room/messages/stateRequest'}]
  publishRoomState:
    action: send
    channel: {$ref: '#/channels/room'}
    title: 公開状態スナップショットの配信
    messages: [{$ref: '#/channels/room/messages/roomState'}]
  publishPhaseChanged:
    action: send
    channel: {$ref: '#/channels/room'}
    title: フェーズ遷移の配信
    summary: ゲーム開始（HTTPで受理）を含む全フェーズ遷移をこのイベントで全員へ配信する
    messages: [{$ref: '#/channels/room/messages/phaseChanged'}]
  publishChatPublished:
    action: send
    channel: {$ref: '#/channels/room'}
    title: 受理した公開チャットの配信
    messages: [{$ref: '#/channels/room/messages/chatPublished'}]
  publishPlayerConnectionChanged:
    action: send
    channel: {$ref: '#/channels/room'}
    title: プレイヤー接続状態の配信
    messages: [{$ref: '#/channels/room/messages/playerConnectionChanged'}]
  publishGamePaused:
    action: send
    channel: {$ref: '#/channels/room'}
    title: 切断による一時停止の配信
    summary: 最初の切断から20秒を共通の再接続期限とし、待機中の追加切断で延長しない
    messages: [{$ref: '#/channels/room/messages/gamePaused'}]
  publishGameResumed:
    action: send
    channel: {$ref: '#/channels/room'}
    title: 再接続後の再開の配信
    summary: 切断しているプレイヤー全員が再接続した場合のみ、保存した残り時間から新しい締切を設定して再開する。一部だけの再接続では停止を維持する
    messages: [{$ref: '#/channels/room/messages/gameResumed'}]
  publishSkipProgress:
    action: send
    channel: {$ref: '#/channels/room'}
    title: 議論スキップの賛成状況の配信
    summary: discussion.skip を受理するたびに賛成人数だけを配信する。誰が賛成したかは配信しない
    messages: [{$ref: '#/channels/room/messages/skipProgress'}]
  publishVoteProgress:
    action: send
    channel: {$ref: '#/channels/room'}
    title: 投票進捗の配信
    summary: 投票（HTTP）を受理するたびに人数だけを配信する。誰が誰に投票したかは配信しない
    messages: [{$ref: '#/channels/room/messages/voteProgress'}]
  publishResultPublished:
    action: send
    channel: {$ref: '#/channels/room'}
    title: 確定結果の公開
    summary: RESULTへの遷移時に全役職・両陣営のお題・得票数を全員（観戦者含む）へ公開する
    messages: [{$ref: '#/channels/room/messages/resultPublished'}]
  publishGameAborted:
    action: send
    channel: {$ref: '#/channels/room'}
    title: 勝敗なし中止の配信
    summary: 秘密情報（役職・お題）は含めない。戦績にも記録しない
    messages: [{$ref: '#/channels/room/messages/gameAborted'}]
  publishPrivateState:
    action: send
    channel: {$ref: '#/channels/user'}
    title: 本人用秘密情報の配信
    summary: DEALING時と再接続時に、自分のお題だけを本人へ配信する
    messages: [{$ref: '#/channels/user/messages/privateState'}]
  publishConnectionReplaced:
    action: send
    channel: {$ref: '#/channels/user'}
    title: 接続置換の通知
    summary: 古いChannelだけへ直接送信し、送信後にそのChannelを終了する
    messages: [{$ref: '#/channels/user/messages/connectionReplaced'}]
  publishFriendPresenceChanged:
    action: send
    channel: {$ref: '#/channels/user'}
    title: フレンドのオンライン状態変化の配信
    summary: フレンド画面の表示更新に使う。Phoenix Presence の変化を購読して配信する
    messages: [{$ref: '#/channels/user/messages/friendPresenceChanged'}]
  publishRoomInvited:
    action: send
    channel: {$ref: '#/channels/user'}
    title: 部屋への招待通知の配信
    summary: フレンドから部屋への招待を受信した際に本人へプッシュ配信する
    messages: [{$ref: '#/channels/user/messages/roomInvited'}]
components:
  messages:
    comebackDraft:
      name: comeback.draft
      payload:
        type: object
        required: [content]
        additionalProperties: false
        properties:
          content: {type: string, minLength: 0, maxLength: 80}
    comebackSubmit:
      name: comeback.submit
      payload:
        type: object
        required: [content]
        additionalProperties: false
        properties:
          content: {type: string, minLength: 1, maxLength: 80}
    comebackUpdated:
      name: comeback.updated
      payload: {$ref: '#/components/schemas/ComebackState'}
    roomReady:
      name: room.ready
      title: room.ready（クライアント→サーバー）
      payload:
        type: object
        required: [ready]
        additionalProperties: false
        properties:
          ready: {type: boolean}
    chatSend:
      name: chat.send
      title: chat.send（クライアント→サーバー）
      payload:
        type: object
        required: [clientMessageId, content]
        additionalProperties: false
        properties:
          clientMessageId: {type: string, description: 送信元タブ内で一意なUUID。重複排除に使う}
          content: {type: string, minLength: 1, maxLength: 300, description: trim後1〜300文字。プレーンテキストとして扱う}
    discussionSkip:
      name: discussion.skip
      title: discussion.skip（クライアント→サーバー）
      payload:
        type: object
        required: [skip]
        additionalProperties: false
        properties:
          skip: {type: boolean, description: 賛成するなら true、取り消すなら false}
    stateRequest:
      name: state.request
      title: state.request（クライアント→サーバー）
      payload:
        type: object
        additionalProperties: false
    roomRemoved:
      name: room.removed
      title: room.removed（サーバー→退出対象者）
      payload: {$ref: '#/components/schemas/RoomRemoved'}
    roomState:
      name: room.state
      title: room.state（サーバー→全員）
      payload: {$ref: '#/components/schemas/RoomStateSnapshot'}
    phaseChanged:
      name: phase.changed
      title: phase.changed（サーバー→全員）
      payload:
        type: object
        required: [gameId, phase, phaseVersion, deadline]
        properties:
          gameId: {type: string}
          phase: {$ref: '#/components/schemas/Phase'}
          phaseVersion: {type: integer, description: 古い配信の破棄に使う単調増加値}
          deadline: {type: ['string', 'null'], format: date-time, description: 締切のないフェーズは null}
    chatPublished:
      name: chat.published
      title: chat.published（サーバー→全員）
      payload:
        type: object
        required: [messageId, clientMessageId, userId, displayName, content, sentAt]
        properties:
          messageId: {type: string, description: サーバーが発行}
          clientMessageId: {type: string}
          userId: {type: string}
          displayName: {type: string}
          content: {type: string, maxLength: 300}
          sentAt: {type: string, format: date-time, description: サーバーが発行}
    playerConnectionChanged:
      name: player.connection_changed
      title: player.connection_changed（サーバー→全員）
      payload:
        type: object
        required: [userId, connected]
        properties:
          userId: {type: string}
          connected: {type: boolean}
    gamePaused:
      name: game.paused
      title: game.paused（サーバー→全員）
      payload:
        type: object
        required: [reason, disconnectedUserIds, reconnectDeadline]
        properties:
          reason: {type: string, enum: [PLAYER_DISCONNECTED]}
          disconnectedUserIds:
            type: array
            items: {type: string}
          reconnectDeadline: {type: string, format: date-time}
    gameResumed:
      name: game.resumed
      title: game.resumed（サーバー→全員）
      payload:
        type: object
        required: [phase, phaseVersion, deadline]
        properties:
          phase: {$ref: '#/components/schemas/Phase'}
          phaseVersion: {type: integer}
          deadline: {type: string, format: date-time}
    skipProgress:
      name: skip.progress
      title: skip.progress（サーバー→全員）
      payload: {$ref: '#/components/schemas/SkipProgress'}
    voteProgress:
      name: vote.progress
      title: vote.progress（サーバー→全員）
      payload: {$ref: '#/components/schemas/VoteProgress'}
    resultPublished:
      name: result.published
      title: result.published（サーバー→全員）
      payload: {$ref: '#/components/schemas/GameResult'}
    gameAborted:
      name: game.aborted
      title: game.aborted（サーバー→全員）
      payload:
        type: object
        required: [gameId, reason, nextPhase]
        properties:
          gameId: {type: string}
          reason: {type: string, enum: [RECONNECT_TIMEOUT, INTERNAL_ERROR]}
          nextPhase: {type: string, enum: [LOBBY]}
    privateState:
      name: private.state
      title: private.state（サーバー→本人）
      payload:
        type: object
        required: [gameId, word, category]
        description: 本人だけの秘密のお題。多数派・少数派の別（役職）は結果確定まで本人にも配信しない
        properties:
          gameId: {type: string}
          word: {type: string, examples: [図書館]}
          category: {$ref: '#/components/schemas/Genre'}
    connectionReplaced:
      name: connection.replaced
      title: connection.replaced（サーバー→古い接続の本人）
      payload:
        type: object
        required: [reason]
        properties:
          reason: {type: string, enum: [NEWER_CONNECTION]}
    friendPresenceChanged:
      name: friend.presence_changed
      title: friend.presence_changed（サーバー→本人）
      payload:
        type: object
        required: [userId, state]
        properties:
          userId: {type: string, description: 状態が変化したフレンドのID}
          state: {type: string, enum: [ONLINE, IN_GAME, OFFLINE]}
    roomInvited:
      name: room.invited
      title: room.invited（サーバー→本人）
      payload: {$ref: '#/components/schemas/RoomInvite'}
  schemas:
    RoomRemoved:
      type: object
      required: [roomId, reason]
      properties:
        roomId: {type: string}
        roomName: {type: string, description: 本人用チャンネルへの通知には部屋名を含める}
        reason: {type: string, enum: [REMOVED_BY_HOST]}
    Phase:
      type: string
      enum: [LOBBY, DEALING, DISCUSSION, VOTING, COMEBACK, RESULT]
      description: '一時停止は独立フェーズにせず、進行フェーズに `paused: true` を付与する'
    RoomGenre:
      type: string
      description: 選択可能なお題ジャンル。恋愛・本音と価値観は廃止し、新規作成・設定変更では指定できない。
      enum: [PLACE, FOOD, HOBBY, DAILY_ITEM, WORK_SCHOOL, ENTERTAINMENT]
    Genre:
      type: string
      enum: [PLACE, FOOD, HOBBY, DAILY_ITEM, WORK_SCHOOL, ENTERTAINMENT, ROMANCE, VALUES]
      description: 'お題ジャンル。openapi.yaml の Genre と同一語彙'
    SkipProgress:
      type: object
      description: 議論スキップに賛成した人数。全員（skippedCount == playerCount）で VOTING へ移る
      required: [skippedCount, playerCount]
      properties:
        skippedCount: {type: integer, examples: [3]}
        playerCount: {type: integer, examples: [6]}
    VoteProgress:
      type: object
      required: [votedCount, playerCount]
      properties:
        votedCount: {type: integer}
        playerCount: {type: integer}
    RoomStateSnapshot:
      type: object
      description: ロビーを含む公開状態のスナップショット。閲覧者によらず同一（秘密情報を含めない）
      required: [roomId, gameId, phase, phaseVersion, deadline, paused, reconnectDeadline, hostUserId, players, spectators, skipProgress, voteProgress, comeback]
      properties:
        comeback:
          description: COMEBACK中の公開入力。それ以外は null
          oneOf:
            - {$ref: '#/components/schemas/ComebackState'}
            - {type: 'null'}
        roomId: {type: string}
        gameId: {type: ['string', 'null'], description: 進行中ゲームがない場合 null}
        phase: {$ref: '#/components/schemas/Phase'}
        phaseVersion: {type: integer}
        deadline: {type: ['string', 'null'], format: date-time, description: 一時停止中は null にして reconnectDeadline を設定する}
        paused: {type: boolean}
        reconnectDeadline: {type: ['string', 'null'], format: date-time}
        hostUserId: {type: string}
        settings:
          type: object
          description: 現在の部屋設定。LOBBY中のジャンル・逆転モード・時間の変更を全員へ配信する
          required: [discussionMs, voteMs]
          properties:
            genres:
              type: array
              minItems: 1
              uniqueItems: true
              items: {$ref: '#/components/schemas/RoomGenre'}
            comebackEnabled: {type: boolean, description: ウルフが市民のお題を当てて逆転できるか}
            discussionMs: {type: integer, minimum: 30000, maximum: 900000}
            voteMs: {type: integer, minimum: 10000, maximum: 180000}
        players:
          type: array
          items:
            type: object
            required: [userId, displayName, avatarUrl, ready, connected]
            properties:
              userId: {type: string}
              displayName: {type: string}
              avatarUrl: {type: string}
              ready: {type: boolean, description: ホストは常に true}
              connected: {type: boolean}
        spectators:
          type: array
          items:
            type: object
            required: [userId, displayName, avatarUrl]
            properties:
              userId: {type: string}
              displayName: {type: string}
              avatarUrl: {type: string}
        skipProgress:
          oneOf:
            - {$ref: '#/components/schemas/SkipProgress'}
            - {type: 'null'}
          description: DISCUSSIONフェーズ以外は null。再接続時に賛成状況を復元するために載せる
        voteProgress:
          oneOf:
            - {$ref: '#/components/schemas/VoteProgress'}
            - {type: 'null'}
          description: VOTINGフェーズ以外は null
    GameResult:
      type: object
      description: 'openapi.yaml の GameResult と同じ公開内容（`myVote` はHTTP側のみ。個別の投票先は配信しない）'
      required: [gameId, winner, reason, wolfUserId, words, players, comeback]
      properties:
        comeback:
          description: 逆転回答の確定内容。逆転回答なしの場合は null
          oneOf:
            - {$ref: '#/components/schemas/ComebackResult'}
            - {type: 'null'}
        gameId: {type: string}
        winner: {type: string, enum: [CITIZEN_SIDE, WOLF_SIDE]}
        reason:
          type: string
          enum: [WOLF_IDENTIFIED, WOLF_ESCAPED, WOLF_GUESSED]
          description: 'WOLF_IDENTIFIED=ウルフが単独最多, WOLF_ESCAPED=ウルフが単独最多でない（同数最多・投票0件を含む）, WOLF_GUESSED=逆転回答に正解'
        wolfUserId: {type: string}
        words:
          type: object
          required: [majority, minority]
          properties:
            majority: {$ref: '#/components/schemas/ResultWord'}
            minority: {$ref: '#/components/schemas/ResultWord'}
        players:
          type: array
          description: openapi.yaml の ResultPlayer と同じ形（UserPublic + 役職・お題・得票数）
          items:
            type: object
            required: [userId, displayName, avatarUrl, role, word, votesReceived]
            properties:
              userId: {type: string}
              displayName: {type: string}
              avatarUrl: {type: string}
              role: {type: string, enum: [CITIZEN, WORD_WOLF]}
              word: {type: string}
              votesReceived: {type: integer}
    ComebackState:
      type: object
      description: 逆転回答の公開状態。正解のお題は含めず、入力内容だけを全員へ公開する
      required: [gameId, wolfUserId, content]
      properties:
        gameId: {type: string}
        wolfUserId: {type: string}
        content: {type: string, maxLength: 80}
    ComebackResult:
      type: object
      required: [answer, correct, timedOut]
      properties:
        answer: {type: string, maxLength: 80}
        correct: {type: boolean}
        timedOut: {type: boolean}
    ResultWord:
      type: object
      required: [word, count]
      properties:
        word: {type: string}
        count: {type: integer, description: このお題を配られた人数}
    RoomInvite:
      type: object
      required: [inviteId, roomId, inviteCode, roomName, from, sentAt]
      properties:
        inviteId: {type: string}
        roomId: {type: string}
        inviteCode: {type: string}
        roomName: {type: string}
        from:
          type: object
          required: [userId, displayName, avatarUrl]
          properties:
            userId: {type: string}
            displayName: {type: string}
            avatarUrl: {type: string}
        sentAt: {type: string, format: date-time}
