#            2026-09-02  yayoi111      (d/socket-auth-lan)          proxy に LAN_HOST を渡す（同一 Wi-Fi の別端末からのアクセス）
#            2026-09-12  yayoi111      (d/creative-tooling)         透過画像の永続化
#            2026-09-16  otnk666       (c/friends-invite)           backend の healthcheck 間隔を短縮し起動待機を高速化
#            2026-09-16  yayoi111      (d/integrate-logout-friends-design) healthcheck の start_period を 5 分に（初回はコンテナ内で deps をコンパイルするため、45 秒では unhealthy になり make up の --wait が落ちる）
#  Authors : 2026-08-26  Jasmine-Gray  (c/user-avatar)              add user avatar update API, avatar-picker component, and profile
#            2026-09-02  yayoi111      (d/integrate-screens-01-04)  DB のホスト側ポートを POSTGRES_HOST_PORT で変更可能にする
