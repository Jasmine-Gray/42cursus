services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb:inception
    pull_policy: build
    container_name: mariadb
    restart: always
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception_network

  wordpress:
    build: ./requirements/wordpress
    image: wordpress:inception
    pull_policy: build
    container_name: wordpress
    restart: always
    depends_on:
      - mariadb
    env_file:
      - .env
    secrets:
      - db_password
      - credentials
      - wp_user_password
    volumes:
      - wp_data:/var/www/wordpress
    networks:
      - inception_network

  nginx:
    build: ./requirements/nginx
    image: nginx:inception
    pull_policy: build
    container_name: nginx
    restart: always
    depends_on:
      - wordpress
    ports:
      - "443:443"
    env_file:
      - .env
    volumes:
      - wp_data:/var/www/wordpress
    networks:
      - inception_network

networks:
  inception_network:
    name: docker-network
    driver: bridge

volumes:
  db_data:
    name: mariadb_volume
    driver: local
  wp_data:
    name: wordpress_volume
    driver: local

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
